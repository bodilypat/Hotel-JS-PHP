<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Management System | Login</title>
    <style>
      :root {
        --bg: #f5f7ff;
        --panel: #ffffff;
        --primary: #4f46e5;
        --primary-dark: #3730a3;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #e5e7eb;
        --shadow: 0 20px 45px rgba(79, 70, 229, 0.12);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%);
        color: var(--text);
      }

      .login-card {
        width: min(100%, 420px);
        background: var(--panel);
        border: 1px solid rgba(229, 231, 235, 0.9);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 32px 28px;
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 26px;
        font-weight: 700;
        font-size: 1.5rem;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), #7c3aed);
        color: #fff;
        font-size: 1.2rem;
      }

      h1 {
        margin: 0 0 8px;
        text-align: center;
        font-size: 2rem;
      }

      .subtitle {
        margin: 0 0 26px;
        text-align: center;
        color: var(--muted);
        font-size: 0.95rem;
      }

      form {
        display: grid;
        gap: 18px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      label {
        font-size: 0.9rem;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 14px 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        font-size: 1rem;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        background: #fff;
      }

      input:focus {
        outline: none;
        border-color: rgba(79, 70, 229, 0.7);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.08);
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      .remember {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }

      .remember input {
        width: auto;
        margin: 0;
      }

      a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }

      a:hover {
        text-decoration: underline;
      }

      button {
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        font-size: 1rem;
        font-weight: 700;
        padding: 15px 18px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.2s ease;
        box-shadow: 0 12px 24px rgba(79, 70, 229, 0.22);
      }

      button:hover {
        transform: translateY(-1px);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 0.8rem;
        margin: 4px 0;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      .socials {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .socials button {
        background: #fff;
        color: var(--text);
        border: 1px solid var(--border);
        box-shadow: none;
        font-weight: 600;
      }

      .signup {
        text-align: center;
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.95rem;
      }

      @media (max-width: 480px) {
        .login-card {
          padding: 24px 18px;
          border-radius: 16px;
        }

        h1 {
          font-size: 1.7rem;
        }

        .socials {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="login-card">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">H</div>
        <span>Hotel Management</span>
      </div>

      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to manage your hotel account</p>

      <form action="../../../backend/public/index.php" method="post">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="username" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
        </div>

        <div class="row">
          <label class="remember">
            <input type="checkbox" name="remember" value="1" />
            <span>Remember me</span>
          </label>
          <a href="forgot-password.html">Forgot password?</a>
        </div>

        <button type="submit">Sign in</button>
      </form>

      <div class="divider">or continue with</div>

      <div class="socials">
        <button type="button">Google</button>
        <button type="button">GitHub</button>
      </div>

      <div class="signup">
        Don’t have an account? <a href="register.html">Sign up</a>
      </div>
    </main>
  </body>
</html>
