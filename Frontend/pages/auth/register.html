<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | Hotel Management System</title>
    <style>
      :root {
        --bg: #f2f6ff;
        --card: #ffffff;
        --primary: #4f46e5;
        --primary-dark: #3730a3;
        --text: #1f2937;
        --muted: #6b7280;
        --border: #dfe7ff;
        --shadow: rgba(79, 70, 229, 0.15);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #eef4ff 0%, #f8f9ff 100%);
        color: var(--text);
      }

      .register-card {
        width: min(100%, 430px);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        box-shadow: 0 18px 45px var(--shadow);
        padding: 32px 28px;
      }

      .brand {
        text-align: center;
        margin-bottom: 10px;
      }

      .brand span {
        display: inline-block;
        width: 48px;
        height: 48px;
        line-height: 48px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary), #7c3aed);
        color: white;
        font-size: 22px;
        font-weight: 700;
      }

      h1 {
        margin: 8px 0 6px;
        text-align: center;
        font-size: 2rem;
      }

      .subtitle {
        margin: 0 0 24px;
        text-align: center;
        color: var(--muted);
        font-size: 0.96rem;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 0.9rem;
      }

      input,
      select,
      button {
        width: 100%;
        border-radius: 12px;
        border: 1px solid var(--border);
        font: inherit;
      }

      input,
      select {
        padding: 13px 14px;
        background: #fbfcff;
        color: var(--text);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus,
      select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
      }

      .inline-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 0 22px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .checkbox-row input {
        width: auto;
        accent-color: var(--primary);
      }

      .submit-btn {
        background: linear-gradient(135deg, var(--primary), #6d5efc);
        color: white;
        border: none;
        padding: 14px 18px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.2s ease;
        box-shadow: 0 10px 20px rgba(79, 70, 229, 0.25);
      }

      .submit-btn:hover {
        transform: translateY(-1px);
      }

      .footer-text {
        text-align: center;
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .footer-text a {
        color: var(--primary-dark);
        text-decoration: none;
        font-weight: 700;
      }

      .error-message {
        display: block;
        min-height: 18px;
        margin-top: 8px;
        color: #dc2626;
        font-size: 0.8rem;
      }

      @media (max-width: 480px) {
        .register-card {
          margin: 18px;
          padding: 24px 18px;
        }

        .inline-group {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="register-card">
      <div class="brand" aria-label="Hotel Management System"><span>H</span></div>
      <h1>Create account</h1>
      <p class="subtitle">Create your guest account to start booking your stay.</p>

      <form id="registerForm" action="../../backend/public/index.php" method="post" novalidate>
        <div class="form-group">
          <label for="fullName">Full name</label>
          <input id="fullName" name="full_name" type="text" placeholder="John Doe" autocomplete="name" required />
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="john@example.com" autocomplete="email" required />
        </div>

        <div class="inline-group">
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="new-password" minlength="8" required />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm</label>
            <input id="confirmPassword" name="confirm_password" type="password" placeholder="••••••••" autocomplete="new-password" minlength="8" required />
            <span id="passwordError" class="error-message" aria-live="polite"></span>
          </div>
        </div>

        <div class="form-group">
          <label for="role">Role</label>
          <select id="role" name="role" required>
            <option value="guest" selected>Guest</option>
          </select>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" name="terms" value="accepted" required />
          <span>I agree to the Terms and Privacy Policy</span>
        </label>

        <button type="submit" class="submit-btn">Create account</button>
      </form>

      <p class="footer-text">Already have an account? <a href="login.html">Log in</a></p>
    </main>

    <script>
      const registerForm = document.getElementById('registerForm');
      const passwordInput = document.getElementById('password');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const passwordError = document.getElementById('passwordError');

      function validatePasswords() {
        if (passwordInput.value !== confirmPasswordInput.value) {
          confirmPasswordInput.setCustomValidity('Passwords do not match');
          passwordError.textContent = 'Passwords do not match.';
          return false;
        }

        confirmPasswordInput.setCustomValidity('');
        passwordError.textContent = '';
        return true;
      }

      confirmPasswordInput.addEventListener('input', validatePasswords);

      registerForm.addEventListener('submit', (event) => {
        if (!validatePasswords() || !registerForm.checkValidity()) {
          event.preventDefault();
          confirmPasswordInput.focus();
        }
      });
    </script>
  </body>
</html>
