<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Reset your Hotel Management System account password.">
	<title>Forgot Password | HMS</title>
	<link rel="stylesheet" href="../../css/variables.css">
	<link rel="stylesheet" href="../../css/style.css">
	<link rel="stylesheet" href="../../css/forms.css">
	<style>
		body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; background: #f4f7fb; color: #172033; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
		.reset-card { width: min(100%, 440px); box-sizing: border-box; padding: clamp(1.5rem, 5vw, 2.5rem); background: #fff; border: 1px solid #e5eaf1; border-radius: 16px; box-shadow: 0 16px 45px rgb(31 45 61 / 9%); }
		.brand { margin: 0 0 2rem; color: #155eef; font-weight: 750; letter-spacing: .04em; }
		h1 { margin: 0 0 .65rem; font-size: clamp(1.7rem, 5vw, 2rem); }
		.intro { margin: 0 0 1.75rem; color: #596579; line-height: 1.6; }
		label { display: block; margin-bottom: .5rem; font-weight: 650; }
		input { width: 100%; min-height: 48px; box-sizing: border-box; padding: .75rem .9rem; border: 1px solid #cbd3df; border-radius: 8px; color: inherit; font: inherit; }
		input:focus { outline: 3px solid rgb(21 94 239 / 20%); border-color: #155eef; }
		button { width: 100%; min-height: 48px; margin-top: 1.25rem; padding: .75rem 1rem; border: 0; border-radius: 8px; background: #155eef; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
		button:hover { background: #104bc2; }
		button:disabled { cursor: wait; opacity: .7; }
		.feedback { min-height: 1.5em; margin: 1rem 0 0; line-height: 1.5; }
		.feedback[data-state="error"] { color: #b42318; }
		.feedback[data-state="success"] { color: #067647; }
		.back-link { display: inline-block; margin-top: 1.5rem; color: #155eef; font-weight: 650; text-decoration: none; }
		.back-link:hover { text-decoration: underline; }
	</style>
</head>
<body>
	<main class="reset-card">
		<p class="brand">HOTEL MANAGEMENT SYSTEM</p>
		<h1>Forgot your password?</h1>
		<p class="intro">Enter the email address associated with your account. If an account exists, we’ll send instructions to reset your password.</p>

		<form id="forgot-password-form" action="/api/auth/forgot-password" method="post" novalidate>
			<label for="email">Email address</label>
			<input id="email" name="email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com" aria-describedby="feedback">
			<button id="submit-button" type="submit">Send reset instructions</button>
			<p id="feedback" class="feedback" role="status" aria-live="polite"></p>
		</form>

		<a class="back-link" href="login.html">&larr; Back to sign in</a>
	</main>

	<script>
		(() => {
			const form = document.getElementById('forgot-password-form');
			const email = document.getElementById('email');
			const button = document.getElementById('submit-button');
			const feedback = document.getElementById('feedback');

			form.addEventListener('submit', async (event) => {
				event.preventDefault();
				feedback.textContent = '';
				feedback.removeAttribute('data-state');

				if (!email.value.trim() || !email.validity.valid) {
					email.setCustomValidity(email.value.trim() ? 'Enter a valid email address.' : 'Enter your email address.');
					email.reportValidity();
					email.setCustomValidity('');
					return;
				}

				button.disabled = true;
				button.textContent = 'Sending…';
				try {
					const response = await fetch(form.action, {
						method: 'POST',
						headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
						body: JSON.stringify({ email: email.value.trim() })
					});
					const result = await response.json().catch(() => ({}));
					if (!response.ok) throw new Error(result.message || 'Unable to process your request. Please try again.');

					feedback.textContent = result.message || 'If an account exists for that email, reset instructions will be sent shortly.';
					feedback.dataset.state = 'success';
					form.reset();
				} catch (error) {
					feedback.textContent = error.message || 'A network error occurred. Please try again.';
					feedback.dataset.state = 'error';
				} finally {
					button.disabled = false;
					button.textContent = 'Send reset instructions';
				}
			});
		})();
	</script>
</body>
</html>
