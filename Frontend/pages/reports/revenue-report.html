<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Revenue report | Hotel management</title>
	<style>
		:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f6fa;font-synthesis:none}
		*{box-sizing:border-box}body{margin:0}.page{max-width:1180px;margin:0 auto;padding:32px 24px}
		header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}
		h1{font-size:28px;margin:0 0 6px}.muted{color:#69758a;font-size:14px}.actions,.filters{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
		button{border:0;border-radius:8px;padding:10px 15px;background:#315de7;color:white;font:inherit;font-weight:600;cursor:pointer}
		button.secondary{background:white;color:#26334b;border:1px solid #dce2ec}button:disabled{opacity:.55;cursor:wait}
		.panel,.card{background:white;border:1px solid #e4e8ef;border-radius:12px;box-shadow:0 2px 8px #1e293b08}
		.filters{padding:18px;margin-bottom:18px}.field{display:grid;gap:6px}.field label{font-size:12px;font-weight:650;color:#566278}
		input,select{height:40px;padding:0 10px;border:1px solid #d9deea;border-radius:7px;background:white;color:#172033;font:inherit}
		.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card{padding:18px}
		.card .label{color:#69758a;font-size:13px}.card strong{display:block;font-size:24px;margin-top:8px;letter-spacing:-.5px}
		.table-wrap{overflow:auto}.table-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid #edf0f5}
		h2{font-size:16px;margin:0}table{border-collapse:collapse;width:100%;min-width:700px}th,td{text-align:right;padding:13px 18px;border-bottom:1px solid #edf0f5;font-size:14px;white-space:nowrap}
		th{color:#69758a;font-size:12px;text-transform:uppercase;letter-spacing:.04em}th:first-child,td:first-child{text-align:left}
		tfoot td{font-weight:700;background:#fafbfc}.status{padding:20px;color:#69758a;text-align:center}.error{color:#b42318}
		@media(max-width:760px){.page{padding:22px 14px}header{flex-direction:column}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
	</style>
</head>
<body>
	<main class="page">
		<header>
			<div><h1>Revenue report</h1><div class="muted">Track room, dining, and other hotel revenue.</div></div>
			<div class="actions"><button class="secondary" id="exportCsv" type="button">Export CSV</button><button id="apply" type="button">Run report</button></div>
		</header>

		<section class="panel filters" aria-label="Report filters">
			<div class="field"><label for="from">From</label><input id="from" type="date" required></div>
			<div class="field"><label for="to">To</label><input id="to" type="date" required></div>
			<div class="field"><label for="category">Revenue category</label><select id="category"><option value="all">All categories</option><option value="room">Room</option><option value="food_beverage">Food &amp; beverage</option><option value="other">Other</option></select></div>
			<div class="field"><label for="currency">Currency</label><select id="currency"><option value="USD">USD</option><option value="EUR">EUR</option><option value="GBP">GBP</option><option value="CAD">CAD</option></select></div>
		</section>

		<section class="cards" aria-label="Revenue summary">
			<article class="card"><div class="label">Gross revenue</div><strong id="gross">—</strong></article>
			<article class="card"><div class="label">Net revenue</div><strong id="net">—</strong></article>
			<article class="card"><div class="label">Taxes &amp; adjustments</div><strong id="taxes">—</strong></article>
			<article class="card"><div class="label">Occupancy</div><strong id="occupancy">—</strong></article>
		</section>

		<section class="panel table-wrap" aria-labelledby="breakdown-title">
			<div class="table-head"><h2 id="breakdown-title">Revenue breakdown</h2><span class="muted" id="period"></span></div>
			<div id="message" class="status" role="status">Choose a date range and run the report.</div>
			<table id="results" hidden>
				<thead><tr><th>Date</th><th>Room</th><th>Food &amp; beverage</th><th>Other</th><th>Tax</th><th>Total</th></tr></thead>
				<tbody></tbody><tfoot><tr><td>Total</td><td id="sumRoom"></td><td id="sumFood"></td><td id="sumOther"></td><td id="sumTax"></td><td id="sumTotal"></td></tr></tfoot>
			</table>
		</section>
	</main>
	<script>
		// PHP backend contract: GET /api/reports/revenue.php?from=YYYY-MM-DD&to=YYYY-MM-DD&category=all&currency=USD
		// Return { currency, summary: { gross, net, taxes, occupancy }, rows: [{ date, room, food_beverage, other, tax, total }] }.
		const endpoint = '/api/reports/revenue.php';
		const $ = id => document.getElementById(id);
		const money = value => new Intl.NumberFormat(undefined, {style:'currency', currency:$('currency').value}).format(Number(value || 0));
		const escapeText = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

		async function loadReport() {
			const from = $('from').value, to = $('to').value;
			if (!from || !to || from > to) { showMessage('Select a valid date range.', true); return; }
			const button = $('apply'); button.disabled = true; showMessage('Loading report…');
			const query = new URLSearchParams({from, to, category:$('category').value, currency:$('currency').value});
			try {
				const response = await fetch(`${endpoint}?${query}`, {headers:{Accept:'application/json'}, credentials:'same-origin'});
				if (!response.ok) throw new Error(`Report request failed (${response.status}).`);
				const data = await response.json();
				if (!data.summary || !Array.isArray(data.rows)) throw new Error('The server returned an invalid report.');
				render(data); $('period').textContent = `${from} – ${to}`;
			} catch (error) { showMessage(error.message || 'Unable to load the report.', true); }
			finally { button.disabled = false; }
		}
		function showMessage(text, isError=false) {
			$('results').hidden = true; $('message').hidden = false;
			$('message').className = `status${isError ? ' error' : ''}`; $('message').textContent = text;
		}
		function render(data) {
			$('gross').textContent = money(data.summary.gross); $('net').textContent = money(data.summary.net);
			$('taxes').textContent = money(data.summary.taxes); $('occupancy').textContent = `${Number(data.summary.occupancy || 0).toFixed(1)}%`;
			const fields = ['room','food_beverage','other','tax','total'];
			$('results').querySelector('tbody').innerHTML = data.rows.map(row => `<tr><td>${escapeText(row.date)}</td>${fields.map(key=>`<td>${money(row[key])}</td>`).join('')}</tr>`).join('');
			const totals = {room:0,food_beverage:0,other:0,tax:0,total:0};
			data.rows.forEach(row => fields.forEach(key => totals[key] += Number(row[key] || 0)));
			['room','food_beverage','other','tax','total'].forEach((key,index) => $('sum'+['Room','Food','Other','Tax','Total'][index]).textContent = money(totals[key]));
			$('message').hidden = true; $('results').hidden = false;
		}
		$('apply').addEventListener('click', loadReport);
		$('exportCsv').addEventListener('click', () => {
			const from=$('from').value, to=$('to').value;
			if (!from || !to || from>to) { showMessage('Select a valid date range before exporting.', true); return; }
			const query = new URLSearchParams({from,to,category:$('category').value,currency:$('currency').value});
			// Export endpoint streams a CSV attachment after applying the same authorization and filters.
			window.location.assign(`/api/reports/revenue-export.php?${query}`);
		});
		const today = new Date(), first = new Date(today.getFullYear(), today.getMonth(), 1);
		$('from').value = first.toISOString().slice(0,10); $('to').value = today.toISOString().slice(0,10);
	</script>
</body>
</html>
