<!-- Reusable hotel management alert components -->
<div class="alert alert-success" role="status" aria-live="polite">
	<span class="alert__icon" aria-hidden="true">✓</span>
	<div class="alert__content">
		<strong class="alert__title">Success</strong>
		<p class="alert__message">Your booking has been confirmed.</p>
	</div>
	<button class="alert__close" type="button" aria-label="Dismiss notification">&times;</button>
</div>

<div class="alert alert-error" role="alert">
	<span class="alert__icon" aria-hidden="true">!</span>
	<div class="alert__content">
		<strong class="alert__title">Something went wrong</strong>
		<p class="alert__message">The payment could not be processed. Please try again.</p>
	</div>
	<button class="alert__close" type="button" aria-label="Dismiss notification">&times;</button>
</div>

<div class="alert alert-warning" role="status" aria-live="polite">
	<span class="alert__icon" aria-hidden="true">&#9888;</span>
	<div class="alert__content">
		<strong class="alert__title">Action required</strong>
		<p class="alert__message">This room is not available for the selected dates.</p>
	</div>
	<button class="alert__close" type="button" aria-label="Dismiss notification">&times;</button>
</div>

<div class="alert alert-info" role="status" aria-live="polite">
	<span class="alert__icon" aria-hidden="true">i</span>
	<div class="alert__content">
		<strong class="alert__title">Information</strong>
		<p class="alert__message">Check-in begins at 3:00 PM.</p>
	</div>
	<button class="alert__close" type="button" aria-label="Dismiss notification">&times;</button>
</div>
